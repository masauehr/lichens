<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地衣類フォトマップ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    #map { height: 100%; }
    #info {
      position: absolute; z-index: 1000; top: 10px; left: 50px;
      background: rgba(255,255,255,.92); padding: 6px 12px; border-radius: 6px;
      font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .thumb-icon { border: 2px solid #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.5); object-fit: cover; }
    .popup img { width: 240px; max-width: 100%; border-radius: 4px; cursor: zoom-in; display: block; }
    .popup div { margin-top: 4px; font-size: 13px; }
    #viewer {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,.85); align-items: center; justify-content: center; cursor: zoom-out;
    }
    #viewer img { max-width: 95vw; max-height: 95vh; }
  </style>
</head>
<body>
  <div id="info">読み込み中…</div>
  <div id="map"></div>
  <div id="viewer"><img alt=""></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script>
    // 背景地図（国土地理院の航空写真・標準地図 / OSM）
    const gsiAttr = '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>';
    const layers = {
      '航空写真（地理院）': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
        { attribution: gsiAttr, maxZoom: 19 }),
      '標準地図（地理院）': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
        { attribution: gsiAttr, maxZoom: 18 }),
      'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }),
    };
    const map = L.map('map', { layers: [layers['航空写真（地理院）']] });
    L.control.layers(layers).addTo(map);

    const viewer = document.getElementById('viewer');
    viewer.addEventListener('click', () => { viewer.style.display = 'none'; });

    function fmt(iso) {
      if (!iso) return '日時不明';
      const d = new Date(iso);
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ` +
        `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    fetch('photos.json').then(r => r.json()).then(photos => {
      const cluster = L.markerClusterGroup({ maxClusterRadius: 40 });
      photos.forEach(p => {
        const icon = L.divIcon({
          className: '',
          html: `<img class="thumb-icon" src="${p.thumb}" width="40" height="40">`,
          iconSize: [44, 44],
        });
        const m = L.marker([p.lat, p.lon], { icon });
        const box = document.createElement('div');
        box.className = 'popup';
        box.innerHTML = `<img src="${p.thumb}" alt="${p.id}"><div>${p.id}　${fmt(p.taken)}</div>`;
        box.querySelector('img').addEventListener('click', () => {
          viewer.querySelector('img').src = p.photo;
          viewer.style.display = 'flex';
        });
        m.bindPopup(box);
        cluster.addLayer(m);
      });
      map.addLayer(cluster);
      map.fitBounds(cluster.getBounds().pad(0.1));
      document.getElementById('info').textContent = `地衣類フォトマップ：${photos.length}枚`;
    }).catch(e => {
      document.getElementById('info').textContent = 'photos.json の読み込みに失敗しました（ローカルでは http サーバー経由で開いてください）';
      console.error(e);
    });
  </script>
</body>
</html>
